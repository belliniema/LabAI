<p>Torino, 3 marzo 1848.</p>
<p>Caro amico, ti scrivo per raccontarti le notizie della settimana.</p>
<p>In citta si parla soltanto dello Statuto e delle riforme annunciate dal Re.</p>
<p>Ti abbraccio, il tuo affezionato cugino.</p>
